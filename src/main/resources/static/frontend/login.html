<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - CourseHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">


    <!-- ================= HEADER ================= -->

    <header class="login-header">

        <a href="index.html"
           class="login-logo">

            <span class="logo-mark">
                CH
            </span>

            <span>
                CourseHub
            </span>

        </a>


        <nav class="login-nav">

            <a href="index.html">
                Home
            </a>

            <a href="login.html"
               class="login-nav-active">

                Login

            </a>

        </nav>

    </header>


    <!-- ================= LOGIN MAIN ================= -->

    <main class="login-main">


        <!-- ================= INTRO ================= -->

        <section class="login-intro">

            <div class="small-heading">
                COURSEHUB
            </div>

            <h1>
                Welcome back.
            </h1>

            <p>
                Sign in to continue learning and manage your courses.
            </p>

        </section>


        <!-- ================= LOGIN CARD ================= -->

        <section class="login-container">


            <div class="login-card-header">

                <div>

                    <div class="panel-label">
                        STUDENT ACCESS
                    </div>

                    <h2>
                        Sign in
                    </h2>

                </div>

            </div>


            <!-- ================= LOGIN FORM ================= -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button">

                    Sign In
                    <span>→</span>

                </button>


                <!-- LOGIN MESSAGE -->

                <p id="loginMessage"
                   class="login-message">
                </p>

            </form>


            <!-- ================= BACK HOME ================= -->

            <a href="index.html"
               class="back-home">

                ← Back to Home

            </a>

        </section>


        <!-- ================= LOGIN NOTE ================= -->

        <div class="login-note">

            <span>
                New to CourseHub?
            </span>

            <a href="index.html">
                Explore the platform →
            </a>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="login-footer">

        <span>
            © 2026 CourseHub
        </span>

        <span>
            Online Course Management System
        </span>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
```
